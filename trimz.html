ind:'service',commission:0}){return `<div class="bill-edit-line" data-commission="${Number(x.commission)||0}"><input class="edit-line-name" value="${esc(x.name||'')}" aria-label="Item name"><input class="edit-line-qty" type="number" min="1" step="1" value="${Number(x.qty)||1}" aria-label="Quantity"><input class="edit-line-price" type="number" min="0" step="0.01" value="${Number(x.price)||0}" aria-label="Unit price"><select class="edit-line-kind" aria-label="Item type"><option value="service" ${x.kind==='product'?'':'selected'}>Service</option><option value="product" ${x.kind==='product'?'selected':''}>Product</option></select><button class="pill btn-danger" type="button" onclick="this.closest('.bill-edit-line').remove()" title="Remove item">×</button></div>`}function editBill(i){const b=data.bills[i];if(!b)return;const lines=b.lines?.length?b.lines:[{name:b.items||'Service',qty:1,price:Number(b.subtotal??b.total),kind:'service',commission:0}];document.getElementById('modal-box').innerHTML=`<div class="modal-head"><h2>Edit bill ${esc(b.no)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Customer name</label><input id="edit-bill-customer" value="${esc(b.customer||'')}"></div><div class="field"><label>Mobile number</label><input id="edit-bill-phone" value="${esc(b.phone||'')}"></div><div class="field"><label>Staff</label><select id="edit-bill-staff"><option value="">—</option>${data.staff.map(x=>`<option value="${esc(x.name)}" ${b.staff===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Payment mode</label><select id="edit-bill-mode">${['UPI','Cash','Card','Split payment'].map(x=>`<option ${b.mode===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="panel-head" style="margin-top:16px"><div><div class="panel-title">Items</div><div class="panel-sub">Edit item name, quantity, price and type.</div></div><button class="pill" onclick="ad
